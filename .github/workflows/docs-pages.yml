name: Docs pages

# Deploy redirect stubs for the former Team Hub API VitePress site to GitHub Pages.
#
# Canonical documentation now lives on harborclient.com under /team-hub-api/.
# Source and releases moved to the HarborClient monorepo
# (https://github.com/harborclient/harborclient/tree/main/packages/team-hub-api).
#
# Required repository setup:
#   Settings → Pages → Build and deployment → Source: GitHub Actions

on:
  push:
    branches:
      - main
    paths:
      - scripts/build-redirect-site.mjs
      - .github/workflows/docs-pages.yml
      - README.md
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build redirect stubs
        run: node scripts/build-redirect-site.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
